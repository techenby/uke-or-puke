name: uke-or-puke
icon: null
processes:
  Watch:
    command: php artisan native:run ios --watch
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Prompt log:
    command: php artisan prompts:sync --watch=120 --quiet-summary
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
